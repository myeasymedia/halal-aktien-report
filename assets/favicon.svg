<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Das Zeichen der Kopfzeile als Symbol für den Browser-Tab.
       Als SVG statt PNG: eine Datei für jede Größe, rund 400 Byte
       statt mehrerer Kilobyte, und auf jedem Bildschirm scharf. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee6a8"/>
      <stop offset="100%" stop-color="#0f4c46"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <text x="32" y="45" font-family="Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="600" fill="#070d0c"
        text-anchor="middle">B</text>
</svg>
